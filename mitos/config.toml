theme = "wolf-alabaster-light"

[editor]
text-width = 120
line-number = "relative"
mouse = false
border-style = "plain"
true-color = true
cursorline = true
rulers = [80, 120]
trim-trailing-whitespace = true
bufferline = "multiple"
editor-config = true
end-of-line-diagnostics = "disable"


[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "none"
nnbsp = "none"
newline = "none"

[editor.smart-tab]
enable = false

[editor.soft-wrap]
enable = true
max-wrap = 25
max-indent-retain = 0
wrap-at-text-width = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "branch", "file-name", "file-modification-indicator"]
right = ["diagnostics", "file-type", "position", "position-percentage", "search-position", "file-encoding", "file-line-ending"]

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
"#" = "toggle_comments"
"^" = "goto_first_nonwhitespace"
"$" = "goto_line_end"
"D" = "@vgld"
"X" = "select_line_above"
ret = "expand_selection"
backspace = "shrink_selection"
minus = "file_picker_in_current_buffer_directory"
"}" = ["goto_next_paragraph", "collapse_selection"]
"{" = ["goto_previous_paragraph", "collapse_selection"]
C-x = [":buffer-close!"]
space.B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
space.q = ":buffer-close"

[keys.select]
"^" = "goto_first_nonwhitespace"
"$" = "goto_line_end"
ret = "expand_selection"
backspace = "shrink_selection"
"}" = "goto_next_paragraph"
"{" = "goto_previous_paragraph"

[keys.insert]
# j = {j = "normal_mode"}
