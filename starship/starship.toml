format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$fill\
$kubernetes\
$jobs\
$time\
$line_break\
$character"""

[directory]
format = "[$path]($style) "
style = "blue"
truncation_length = 3
truncation_symbol = ".../"
fish_style_pwd_dir_length = 1

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](purple)"

[git_branch]
format = "[$branch]($style)"

[git_status]
# conflicted = "="
# untracked = "?"
# modified = "!"
# staged = "+"
# renamed = "»"
# deleted = "✘"
# stashed = '\$'
# ahead = '⇡${count}'
# diverged = '⇕⇡${ahead_count}⇣${behind_count}'
# behind = '⇣${count}'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = " [$duration]($style) "
style = "yellow"

[kubernetes]
disabled = false
format = '[$context(\($namespace\))]($style) '

[jobs]
format = "[%$number]($style)"
number_threshold = 1

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time ]($style)"


